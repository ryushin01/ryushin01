# 프로젝트 표의 이름 뒤 버전 "(v1.2.3)"을 각 저장소의 현재 버전으로 맞춥니다.
# 30분마다, README가 바뀔 때(새 프로젝트 줄 등), 그리고 손으로 실행할 때 돕니다.
name: 프로젝트 버전

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-versions
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 버전 읽어 표 고치기
        run: node scripts/versions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet README.md; then
            echo "바뀐 버전이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: 프로젝트 버전 갱신" README.md
          git pull --rebase
          git push
